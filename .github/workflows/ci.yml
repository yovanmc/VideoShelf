name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore VideoShelf.slnx

      - name: Build
        shell: pwsh
        run: dotnet build VideoShelf.slnx -c Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test VideoShelf.slnx -c Release --no-build --verbosity normal
